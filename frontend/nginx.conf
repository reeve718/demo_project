server {
  listen 80;
  server_name _;

  # Static assets shipped from the Vite build
  root /usr/share/nginx/html;
  index index.html;

  # Long-lived caching for hashed assets
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
  }

  # Forward API requests to the backend container
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: every non-asset route resolves to index.html so Vue Router
  # can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}